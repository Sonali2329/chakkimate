databases:
  - name: chakkimate-db
    databaseName: chakkimate
    user: chakkimate_user
    plan: free

services:
  - type: web
    name: chakkimate
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn chakkimate_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: chakkimate-db
          property: connectionString
