<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - सर्व्हर त्रुटी | ChakkiMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow-sm border p-4 p-md-5 bg-white rounded-4 text-center" style="max-width: 480px;">
        <div class="text-danger display-1 fw-bold mb-2">500</div>
        <h4 class="fw-bold text-dark mb-2">सर्व्हर त्रुटी उद्भवली / Server Error</h4>
        <p class="text-muted small mb-4">
            काहीतरी अनपेक्षित तांत्रिक अडचण आली आहे. कृपया थोड्या वेळाने पुन्हा प्रयत्न करा किंवा डॅशबोर्डवर जा.<br>
            An internal server error occurred. Please try again.
        </p>
        <div class="d-grid gap-2">
            <a href="/" class="btn btn-primary fw-bold py-2.5 rounded-3">
                <i class="bi bi-house me-1"></i> मुख्य पृष्ठावर जा (Home)
            </a>
            <button onclick="window.location.reload()" class="btn btn-outline-secondary fw-semibold py-2 rounded-3">
                <i class="bi bi-arrow-clockwise me-1"></i> पृष्ठ रीफ्रेश करा (Refresh)
            </button>
        </div>
    </div>
</body>
</html>
