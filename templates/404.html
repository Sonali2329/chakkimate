{% extends 'girni/base.html' %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm border p-4 p-md-5 bg-white rounded-4">
                <div class="text-warning display-1 fw-bold mb-2">404</div>
                <h4 class="fw-bold text-dark mb-2">पृष्ठ सापडले नाही / Page Not Found</h4>
                <p class="text-muted small mb-4">
                    तुम्ही शोधत असलेले पृष्ठ अस्तित्वात नाही किंवा बदलण्यात आले आहे.<br>
                    The page you requested could not be found.
                </p>
                <div class="d-grid gap-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-primary fw-bold py-2.5 rounded-3">
                        <i class="bi bi-house me-1"></i> डॅशबोर्डवर परत जा (Go to Dashboard)
                    </a>
                    <button onclick="window.history.back()" class="btn btn-outline-secondary fw-semibold py-2 rounded-3">
                        <i class="bi bi-arrow-left me-1"></i> मागे जा (Go Back)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
